name: Bug report
description: Report a reproducible problem in Blackwall.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Report vulnerabilities through GitHub's private vulnerability reporting, following SECURITY.md. Remove credentials and private model transcripts from reports."
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Blackwall version, macOS version, CPU architecture, and relevant model/relay setup.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs
