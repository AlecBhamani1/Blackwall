name: Feature or maintenance request
description: Track work for an upcoming release batch.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior that makes this work complete.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      description: Link related issues and note security or migration considerations.
