name: Partial merge queue

on:
  pull_request_target:
    branches: [partial]
    types: [labeled, unlabeled, synchronize, reopened, closed, ready_for_review, converted_to_draft, edited]
  workflow_run:
    workflows: [CI, Branch policy]
    types: [completed]
  push:
    branches: [partial]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name == 'ready-to-merge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # Always execute the protected integration branch's code, never PR code.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: partial
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Record or withdraw maintainer approval for this head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/repository/merge-queue.mjs authorize

  process:
    needs: authorize
    if: >-
      always() && !cancelled() &&
      (needs.authorize.result == 'success' || needs.authorize.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Each cycle performs at most one update or merge. Lost pending wakeups are
    # recovered by CI completions, partial pushes, and the five-minute schedule.
    concurrency:
      group: partial-merge-queue
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: partial
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Advance the oldest reviewed PR into partial
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: node scripts/repository/merge-queue.mjs process
