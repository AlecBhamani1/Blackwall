name: Publish beta release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [partial]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Serialize releases so an older run cannot replace a newer updater feed.
concurrency:
  group: publish-blackwall-beta-release
  cancel-in-progress: false

env:
  # workflow_run's default-branch SHA/ref are not the beta commit.
  RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
  RELEASE_CHANNEL: beta

jobs:
  prepare:
    name: Validate release and create draft
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'partial' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/partial')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      build_required: ${{ steps.release.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - id: release
        name: Require passing partial CI and an unused newer beta version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/github.mjs prepare

  build-desktop:
    name: Build desktop (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.build_required == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges latest.json into the shared draft; avoid concurrent writes.
      max-parallel: 1
      matrix:
        include:
          # macOS keeps Tauri's default DMG and updater bundles.
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: '' }
          # AppImage updates in place; .deb is offered for apt-based installs.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: '--bundles appimage,deb' }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: '--bundles appimage,deb' }
          # WiX MSI rejects beta pre-release versions; NSIS supports both channels.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: '--bundles nsis' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-deps.sh
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Set the beta application version
        shell: bash
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {releaseVersionParts} from './scripts/release/validate.mjs'; releaseVersionParts(process.env.RELEASE_VERSION); const path='src/app/tauri.conf.json'; const config=JSON.parse(fs.readFileSync(path,'utf8')); config.version=process.env.RELEASE_VERSION; fs.writeFileSync(path,JSON.stringify(config,null,2)+'\n');"
      - name: Build and upload signed updater artifacts to the draft
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src/app
          # node runs the CLI entry point on every runner; .bin shims differ on Windows.
          tauriScript: node ../../ui/node_modules/@tauri-apps/cli/tauri.js
          args: --target ${{ matrix.target }} ${{ matrix.bundles }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

  publish:
    name: Publish complete release and advance updater feed
    needs: [prepare, build-desktop]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.build-desktop.result == 'success' ||
       (needs.prepare.outputs.build_required == 'false' && needs.build-desktop.result == 'skipped'))
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Verify every platform, publish version, and advance the beta feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/github.mjs publish
