name: Branch policy

on:
  pull_request:
    branches: [partial, main]
    types: [opened, synchronize, reopened, edited, ready_for_review, milestoned, demilestoned]
  push:
    branches: [partial, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    name: Production promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Validate branch, version, release notes, milestone, and acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion.mjs

