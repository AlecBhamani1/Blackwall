name: CI

on:
  push:
    branches: [partial, main]
  pull_request:
    branches: [partial, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect scaffold
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      ui: ${{ steps.paths.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: paths
        name: Detect buildable workspaces
        shell: bash
        run: |
          if [[ -f src/Cargo.toml ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f ui/package.json && -f ui/package-lock.json ]]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  release-validation:
    name: Release workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Test release validation and publication failure recovery
        run: node --test scripts/release/*.test.mjs scripts/repository/*.test.mjs

  rust:
    name: Rust quality (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-deps.sh
      - name: Check formatting
        if: runner.os == 'macOS'
        run: cargo fmt --manifest-path src/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --manifest-path src/Cargo.toml --workspace --all-features

  relay-linux:
    name: Relay deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test core and relay on Linux, including process restarts
        run: cargo test --locked --manifest-path src/Cargo.toml --package blackwall-core --package blackwall-relay
      - name: Build the production relay container
        run: docker build --tag blackwall-relay:ci --file deploy/relay/Dockerfile .
      - name: Install Node.js for container acceptance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
      - name: Verify pairing and revocation across container replacement
        run: node deploy/relay/smoke.mjs blackwall-relay:ci

  dependencies:
    name: Dependency policy
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src/Cargo.toml
          arguments: --all-features
          command: check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  ui:
    name: UI quality
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Type-check UI
        run: npm --prefix ui run check
      - name: Test UI
        run: npm --prefix ui run test:run
      - name: Build UI
        run: npm --prefix ui run build

  desktop:
    name: Desktop release build (${{ matrix.target }})
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: app }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: app }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'appimage,deb' }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: 'appimage,deb' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-deps.sh
      - run: npm ci --prefix ui
      - name: Verify every desktop target without publication credentials
        shell: bash
        working-directory: src/app
        run: |
          version=$(node -p "require('../../.github/release.json').version")
          ../../ui/node_modules/.bin/tauri build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config "{\"version\":\"$version\",\"bundle\":{\"createUpdaterArtifacts\":false}}"

  quality-gate:
    name: Quality gate
    needs: [detect, release-validation, rust, relay-linux, dependencies, dependency-review, ui, desktop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
      DESKTOP_REQUIRED: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
      DEPENDENCY_REVIEW_REQUIRED: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Require every applicable check to succeed
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          const required = ['detect', 'release-validation', 'rust', 'relay-linux', 'dependencies', 'ui'];
          if (process.env.DESKTOP_REQUIRED === 'true') required.push('desktop');
          if (process.env.DEPENDENCY_REVIEW_REQUIRED === 'true') required.push('dependency-review');
          const failed = required.filter(name => jobs[name].result !== 'success');
          if (failed.length) {
            console.error('Required checks did not succeed:', failed.join(', '));
            process.exit(1);
          }
          NODE
