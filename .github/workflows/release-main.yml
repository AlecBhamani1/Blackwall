name: Publish main update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-main-update
  cancel-in-progress: true

jobs:
  publish-macos:
    name: Publish macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install UI dependencies
        run: npm ci --prefix ui
      - name: Set monotonically increasing main-channel version
        env:
          UPDATE_VERSION: 0.1.${{ github.run_number }}
        run: |
          node -e "const fs=require('fs');const path='src/app/tauri.conf.json';const config=JSON.parse(fs.readFileSync(path,'utf8'));config.version=process.env.UPDATE_VERSION;fs.writeFileSync(path,JSON.stringify(config,null,2)+'\n')"
      - name: Build, sign, and publish update
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src/app
          tauriScript: ../../ui/node_modules/.bin/tauri
          args: --target ${{ matrix.target }}
          tagName: main
          releaseName: Blackwall main channel
          releaseBody: Signed build of main at ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
          releaseCommitish: main
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
