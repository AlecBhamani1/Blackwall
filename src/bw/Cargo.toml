[package]
name = "bw"
description = "Headless command-line client for Blackwall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blackwall-core = { workspace = true, features = ["credential-store"] }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["termios"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["pty", "std", "termios"] }

[lints]
workspace = true
