[workspace]
members = ["app", "bw", "core", "relay"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/AlecBhamani1/Blackwall"

[workspace.dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22.1"
blackwall-core = { path = "core", version = "0.1.0" }
futures-util = "0.3.31"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8.5"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
tauri = { version = "2.8.4" }
tauri-build = { version = "2.4.1" }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower = { version = "0.5.2", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unwrap_used = "deny"
