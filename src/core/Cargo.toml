[package]
name = "blackwall-core"
description = "Framework-free protocol and agent primitives for Blackwall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6"
async-stream.workspace = true
axum.workspace = true
base64.workspace = true
cap-std = "4.0.3"
futures-util.workspace = true
libc = "0.2.189"
qrcode.workspace = true
rand.workspace = true
reqwest.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10.0"
sha2.workspace = true
similar = "3.2.0"
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "creation-flags"] }
windows = { version = "0.62.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
tower.workspace = true

