services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    environment:
      BLACKWALL_RELAY_BIND: 0.0.0.0:8787
      BLACKWALL_RELAY_TOKEN: ${BLACKWALL_RELAY_TOKEN:?set BLACKWALL_RELAY_TOKEN}
    expose:
      - "8787"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      BLACKWALL_RELAY_DOMAIN: ${BLACKWALL_RELAY_DOMAIN:?set BLACKWALL_RELAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

